<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contrast Oracle browser fixture</title>
  <style>
    html, body { margin: 0; background: white; }
    #gradient {
      width: 900px;
      margin: 20px;
      padding: 30px 0;
      background-color: white;
      background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 50%, #dddddd 100%);
      color: #707070;
      font: 400 16px/24px Arial, sans-serif;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="gradient">Gradient edge contrast regression fixture</div>
  <pre id="result">{"status":"PENDING"}</pre>
  <script src="../src/contrast-oracle.js"></script>
  <script>
    window.addEventListener("load", function () {
      var output;
      try {
        var target = document.getElementById("gradient");
        var report = ContrastOracle.run();
        var serial = ContrastOracle.serializableReport(report);
        var failure = serial.failures.find(function (entry) {
          return entry.text.indexOf("Gradient edge") >= 0;
        });
        var backgroundColorOnly = getComputedStyle(target).backgroundColor;
        var backgroundColorOnlyRatio = ContrastOracle.contrastRatio(
          ContrastOracle.parseColor(getComputedStyle(target).color),
          ContrastOracle.parseColor(backgroundColorOnly)
        );
        var overlay = document.getElementById("contrast-oracle-overlay");
        var overlayCount = overlay ? overlay.shadowRoot.querySelectorAll(".box").length : 0;
        output = {
          status: failure && failure.suggestionPasses && overlayCount > 0 ? "PASS" : "FAIL",
          gradientFailureCaught: Boolean(failure),
          backgroundColorOnlyCheckMissed: backgroundColorOnlyRatio >= 4.5,
          overlayRendered: overlayCount > 0,
          overlayCount: overlayCount,
          suggestionPasses: Boolean(failure && failure.suggestionPasses),
          suggestedHex: failure && failure.suggestedHex,
          ratio: failure && failure.ratio,
          backgroundColorOnlyRatio: backgroundColorOnlyRatio
        };
      } catch (error) {
        output = { status: "FAIL", error: error.stack || String(error) };
      }
      document.getElementById("result").textContent = JSON.stringify(output);
    });
  </script>
</body>
</html>
